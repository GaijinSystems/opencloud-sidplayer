# The browser test's front proxy, standing in for the one in front of a real
# deployment. It is what makes the mirror same-origin with OpenCloud, which is
# the only way the library can read HVSC at all: the mirror sends no CORS
# headers and HVSC's version API refuses requests carrying an Origin header.
#
# Everything but /hvsc-mirror/ goes to OpenCloud unchanged. The mirror route
# is the same shape as deploy/haproxy-hvsc.cfg, which is what an operator
# adds to their own frontend.

global
    log stdout format raw local0 info
    # `http-request normalize-uri` below is still flagged experimental in
    # haproxy 3.4.4 and refuses to parse without this. Measured: without the
    # line the config fails with "'normalize-uri' action is experimental, must
    # be allowed via a global 'expose-experimental-directives'" and haproxy
    # does not start, so an operator cannot miss it.
    expose-experimental-directives

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 120s
    timeout server 120s

frontend fe_test
    # Loopback only. The rig runs with --network=host, so the browser
    # container and this proxy share 127.0.0.1 and nothing needs to be
    # reachable from the network. A `*:9300` bind put an OpenCloud with
    # admin/admin behind it on every interface of whatever machine the tests
    # happened to run on.
    bind 127.0.0.1:9300 ssl crt /certs/test.pem

    # Before any rule that reads the path, and the same lines deploy/haproxy-hvsc.cfg tells an
    # operator to add. HAProxy does not collapse `..` by itself; a browser
    # normalises before sending, so the rig only proves containment if it
    # normalises here too. `curl --path-as-is` is the client that does not.
    # Needs the `expose-experimental-directives` in global above.
    acl is_hvsc path_beg /hvsc-mirror/
    http-request normalize-uri path-merge-slashes if is_hvsc
    http-request normalize-uri path-strip-dotdot if is_hvsc

    acl is_read method GET HEAD
    http-request deny if is_hvsc !is_read
    acl hvsc_plain path_reg ^/hvsc-mirror/([A-Za-z0-9_.!~*\'()/-]|%[0-9A-Fa-f][0-9A-Fa-f])*$
    acl hvsc_encoded_way_out path_reg -i %(2e|2f|5c|25|00|c0|c1)
    http-request deny if is_hvsc !hvsc_plain
    http-request deny if is_hvsc hvsc_encoded_way_out
    http-request deny if is_hvsc { query -m found }
    use_backend be_hvsc_mirror if is_hvsc

    default_backend be_opencloud

backend be_hvsc_mirror
    # The rewrite belongs here, not in the frontend: an ACL is evaluated
    # where it is used, so rewriting the path before `use_backend` would
    # leave `path_beg /hvsc-mirror/` false and send everything to OpenCloud.
    http-request set-path %[path,regsub(^/hvsc-mirror/,/HVSC/)]
    # The same three strips as the deployed config, so the rig exercises the
    # route an operator actually runs: the app fetches this path with
    # `credentials: 'same-origin'`, and none of what the browser attaches for
    # OpenCloud is any business of the mirror's.
    http-request del-header Cookie
    http-request del-header Authorization
    http-request del-header Referer
    # And the rest of deploy/haproxy-hvsc.cfg's backend, line for line, so
    # the rig proves the app works through the hardened route.
    http-request set-src ipv4(0.0.0.0)
    option forwardfor except 0.0.0.0/0
    http-request del-header X-Forwarded- -m beg
    http-request del-header Forwarded
    http-request del-header X-Real-IP
    http-request del-header X-Original-Forwarded-For
    http-request del-header X-Client-IP
    http-request del-header True-Client-IP
    http-request del-header CF-Connecting-IP
    http-request del-header Via
    http-request del-header Origin
    http-request del-header Accept-Language
    http-request del-header Sec-CH- -m beg
    http-request del-header Sec-Fetch- -m beg
    http-request del-header DNT
    http-request del-header Sec-GPC
    http-request del-header Priority
    http-request set-header User-Agent opencloud-sidplayer
    http-response del-header access-control-allow-origin
    http-response del-header Set-Cookie
    http-response del-header Clear-Site-Data
    http-response del-header Strict-Transport-Security
    http-response del-header Refresh
    http-response del-header Service-Worker-Allowed
    http-response del-header NEL
    http-response del-header Report-To
    http-response del-header Reporting-Endpoints
    http-response del-header Alt-Svc
    http-response del-header Accept-CH
    http-response del-header WWW-Authenticate
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Content-Security-Policy "sandbox; default-src 'none'"
    timeout queue 60s
    http-request deny deny_status 503 if { queue ge 256 }
    server mirror 127.0.0.1:9400 maxconn 6

backend be_opencloud
    # TLS terminates at this proxy, as in a real deployment, so the OpenCloud
    # behind it runs with PROXY_TLS=false and OC_URL set to the proxy's own
    # origin. Without that the shell fetches its config, theme and app bundles
    # from OpenCloud's port directly and the browser blocks every one of them
    # as cross-origin under the instance's own CSP.
    # TLS ends here, so the instance behind has to be told what the browser
    # actually spoke; without this OpenCloud builds http:// redirects and the
    # OIDC callback comes back 401.
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 9300
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    server oc 127.0.0.1:9201
