# A same-origin path to the HVSC mirror, for the SID player's library view.
#
# Why this exists: the browser cannot reach HVSC directly. Its version API
# answers 403 to any request carrying an Origin header, and the mirror sends
# no Access-Control-Allow-Origin at all, so a page on your instance is
# blocked from both. Forwarding a path on your own origin removes the
# problem entirely: no CORS, no helper process, no stored credentials. The
# app then checks for new releases and syncs the collection itself.
#
# Add the normalise, ACL and use_backend lines to the frontend that already
# serves OpenCloud, and the backend as it stands. Everything else keeps going
# to OpenCloud as before.
#
# Verified against haproxy 3.4.4 and the live mirror: a tune returns 200
# audio/prs.sid, the 5.2 MB Songlengths.md5 manifest arrives in about 1.3 s,
# PUT is refused with 403, and the upstream certificate validates.
#
# HAProxy resolves the mirror's address when it starts. If it ever moves,
# reload HAProxy or add a `resolvers` section; nothing in the app caches it.

# --- in your global section --------------------------------------------------
#    # For the two normalize-uri lines below. They exist since 2.4 but are
#    # still flagged experimental in 3.4.4, and without this haproxy refuses to
#    # start: "'normalize-uri' action is experimental, must be allowed via a
#    # global 'expose-experimental-directives'". It fails loudly, so you cannot
#    # end up with the ACL and no normalisation.
#    expose-experimental-directives

# --- in your existing OpenCloud frontend -------------------------------------
#    # Normalise before any rule that reads the path, and keep it before them.
#    #
#    # HAProxy does not collapse `..` or duplicate slashes on its own. A
#    # browser and a default curl both normalise the path before sending, which
#    # is why /hvsc-mirror/../../etc/passwd looked contained when it was first
#    # tried; `curl --path-as-is` sends it raw, `path_beg /hvsc-mirror/` still
#    # matches, the regsub below turns it into /HVSC/../../etc/passwd and the
#    # upstream resolves that to any path on the mirror host. These two lines
#    # are what actually confines the route to /HVSC/. The prefix match does
#    # not, and the comment that used to say it did was wrong.
#    #
#    # Only for this route. Unconditional, the two rewrote the path of every
#    # request on the frontend, OpenCloud's own included, which is more than
#    # a snippet for one route has any business doing. The ACL is looked at
#    # again where `use_backend` uses it, after the rewrite, so a path that
#    # normalises out of /hvsc-mirror/ goes to OpenCloud like any other.
#    acl is_hvsc path_beg /hvsc-mirror/
#    http-request normalize-uri path-merge-slashes if is_hvsc
#    http-request normalize-uri path-strip-dotdot if is_hvsc
#
#    # If you would rather not enable experimental directives across your whole
#    # proxy, this refuses the same requests without them, on any version:
#    #    acl has_dotdot path_reg -- (^|/)\.\.(/|$)
#    #    http-request deny if is_hvsc has_dotdot
#
#    acl is_read method GET HEAD
#    # Read-only: the mirror is upstream, nothing here may write to it.
#    http-request deny if is_hvsc !is_read
#    # Only what the app itself would send. path-strip-dotdot sees a literal
#    # `..` and nothing else: `%2e%2e`, `..%2f..`, `..%5c..`, a raw backslash
#    # and `..;/` all get past it and past the regex above, and an upstream
#    # that decodes before resolving would walk out of /HVSC/ on any of them.
#    # So rather than list the ways out, the first rule lists the way in: the
#    # characters encodeURIComponent leaves alone, a `%` and two hex digits
#    # for the ones it does not, and `/`. The second refuses an encoded dot,
#    # slash, backslash, percent or NUL, and the two bytes that only begin an
#    # overlong spelling of one of them, none of which a name in the
#    # collection has - the app never encodes a dot, and a path's slashes
#    # are sent as slashes.
#    acl hvsc_plain path_reg ^/hvsc-mirror/([A-Za-z0-9_.!~*\'()/-]|%[0-9A-Fa-f][0-9A-Fa-f])*$
#    acl hvsc_encoded_way_out path_reg -i %(2e|2f|5c|25|00|c0|c1)
#    http-request deny if is_hvsc !hvsc_plain
#    http-request deny if is_hvsc hvsc_encoded_way_out
#    # Nor a query string. The app never sends one, and forwarded, it would
#    # reach whatever the mirror's server does with one - an index page's
#    # sort options, a script's parameters - which is more than fetching a
#    # file, and makes every request a fresh URL to any cache on the way.
#    http-request deny if is_hvsc { query -m found }
#    use_backend be_hvsc_mirror if is_hvsc

# --- the backend, as is ------------------------------------------------------
backend be_hvsc_mirror
    mode http
    # The mirror serves the unpacked collection under /HVSC/C64Music/, so
    # /hvsc-mirror/C64Music/... maps onto /HVSC/C64Music/...
    #
    # The rewrite is here rather than in the frontend on purpose. HAProxy
    # evaluates an ACL where it is used, not where it is declared, so
    # rewriting the path before `use_backend` would leave
    # `path_beg /hvsc-mirror/` false and quietly send every mirror request to
    # OpenCloud instead. That is exactly what happened the first time.
    http-request set-path %[path,regsub(^/hvsc-mirror/,/HVSC/)]
    http-request set-header Host hvsc.brona.dk

    # Nothing of the user's goes to a third party.
    #
    # The app fetches through this route with `credentials: 'same-origin'`,
    # because to the browser it IS the same origin as OpenCloud. So whatever
    # the browser would send to your instance is sent here too: any cookie
    # scoped to `/` (whether your IdP sets one depends on the IdP, and nothing
    # in the app stops it), the Referer, which is your instance's URL, and an
    # Authorization header if a deployment uses one. None of that is anything
    # hvsc.brona.dk needs to serve a public file, and it is a volunteer's
    # server, not a party to your session. Strip all three here rather than
    # trusting the browser not to send them.
    http-request del-header Cookie
    http-request del-header Authorization
    http-request del-header Referer
    # Nor who is asking, or under what name you serve. A `defaults` section
    # with `option forwardfor`, or a frontend that sets X-Forwarded-*, would
    # otherwise hand the user's address and your hostname to the mirror.
    # `option forwardfor` - in a `defaults` section, say - adds its header
    # after every rule here has run, so no del-header can reach it, and
    # HAProxy has no `no option forwardfor` to turn it off for one backend.
    # What it does have is `except`: no header for a source in that network.
    # One network only, so the source is first set to one that it covers,
    # which is what makes this hold for IPv6 clients as well as IPv4. The
    # outgoing connection is unaffected; HAProxy's own log will show 0.0.0.0
    # as the client of these requests.
    http-request set-src ipv4(0.0.0.0)
    option forwardfor except 0.0.0.0/0
    # By prefix, so the ones not thought of go too: -Prefix, -Ssl, and the
    # client certificate an Envoy or a Traefik in front would pass along.
    http-request del-header X-Forwarded- -m beg
    http-request del-header Forwarded
    http-request del-header X-Real-IP
    # The same again under the names a CDN or another proxy in front of this
    # one uses for the user's address, and the Origin, which is your
    # instance's URL as surely as the Referer is.
    http-request del-header X-Original-Forwarded-For
    http-request del-header X-Client-IP
    http-request del-header True-Client-IP
    http-request del-header CF-Connecting-IP
    http-request del-header Via
    http-request del-header Origin
    # And what describes the browser rather than the request: its languages,
    # its client hints and fetch metadata, its privacy signals, and its
    # own name and version, which goes as the app's instead.
    http-request del-header Accept-Language
    http-request del-header Sec-CH- -m beg
    http-request del-header Sec-Fetch- -m beg
    http-request del-header DNT
    http-request del-header Sec-GPC
    http-request del-header Priority
    http-request set-header User-Agent opencloud-sidplayer

    # Nothing upstream sets CORS headers today; drop any that appear so the
    # response is unambiguously same-origin.
    http-response del-header access-control-allow-origin

    # What comes back is served as your own origin, and it bypasses
    # OpenCloud, so OpenCloud's own policy never applies to it. Anything
    # the mirror sends - a directory listing is HTML, and a compromised or
    # mistaken server could send worse - would otherwise run as your
    # instance, able to read the session the user holds there. The app only
    # ever fetches these as data, which none of the three lines affects:
    # nothing here may set a cookie on your domain, nothing is sniffed into
    # something executable, and a document opened from here directly runs
    # sandboxed, with no script and no origin of its own.
    http-response del-header Set-Cookie
    # Nor may it set policy for your origin: a mirror answering with
    # `Clear-Site-Data` would sign every library user out on each request,
    # and one sending Strict-Transport-Security would pin your whole domain.
    http-response del-header Clear-Site-Data
    http-response del-header Strict-Transport-Security
    http-response del-header Refresh
    http-response del-header Service-Worker-Allowed
    http-response del-header NEL
    http-response del-header Report-To
    http-response del-header Reporting-Endpoints
    http-response del-header Alt-Svc
    http-response del-header Accept-CH
    http-response del-header WWW-Authenticate
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Content-Security-Policy "sandbox; default-src 'none'"

    # The route answers anyone who can reach your proxy: the app fetches it
    # carrying nothing a proxy could check, by design. What can be bounded is
    # what it costs the volunteer behind it. Six connections at a time from
    # your whole instance, the same six a sync uses, with anything beyond
    # them waiting its turn rather than refused - so a sync still completes,
    # and nobody using your instance as a free mirror can multiply the load.
    timeout queue 60s
    # And a limit on the waiting, so that the queue is not itself the thing
    # that can be filled: with this many already waiting, a request is
    # answered 503 at once rather than held. A sync has six in hand and none
    # waiting; this is room for a few dozen of them at the same moment. A
    # rule, because `maxqueue` on the server line does not do it: with one
    # server its overflow only moves to the backend's own queue, which has
    # no limit, and waits there just the same.
    http-request deny deny_status 503 if { queue ge 256 }
    # A tune is a few kB and the manifest is 5 MB; the defaults are ample.
    #
    # No `check` on the server line, deliberately. A health check here buys
    # nothing: the backend has one server, so there is nowhere to fail over
    # to, and a mirror that is down produces a 503 either way - which the app
    # already reports as an unreachable mirror, with the same wording. What it
    # costs is a full TLS handshake to a volunteer's machine every `inter`
    # forever, and `check` with no `inter` means the 2 s default: about 43,000
    # handshakes a day whether or not anyone has ever opened the library. If
    # you want the server to show up in HAProxy's stats page, add
    # `check inter 60s fall 3 rise 2` - 1,440 a day - and not a bare `check`.
    #
    # The upstream certificate is verified: this proxy is fetching files that
    # will be written into a user's space and played, so the connection it
    # makes on their behalf should be as trustworthy as the one they make to
    # you. The CA bundle is where Debian and Alpine both keep it; on a
    # distribution that differs, point ca-file at its own bundle rather than
    # falling back to `verify none`.
    server mirror hvsc.brona.dk:443 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str(hvsc.brona.dk) maxconn 6
